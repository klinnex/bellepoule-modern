<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="1000" height="1175">
  <!-- Cœur ~9 cm. Fond transparent, prévu pour textile marine/noir. -->
  <defs>
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0L5 5M5 0L0 5" stroke="#8fa3c9" stroke-width=".8"/></pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c3cad6"/><stop offset="1" stop-color="#7d8798"/></linearGradient>
    <radialGradient id="field" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#1f3f73"/><stop offset="1" stop-color="#0e2244"/></radialGradient>
    <path id="arcTop" d="M63 195 A137 137 0 0 1 337 195"/>
  </defs>
  
  <circle cx="200" cy="195" r="168" fill="none" stroke="#c3cad6" stroke-width="5"/>
  <circle cx="200" cy="195" r="160" fill="none" stroke="#6b84e8" stroke-width="1.5"/>
  <circle cx="200" cy="195" r="128" fill="url(#field)" stroke="#6b84e8" stroke-width="2"/>
  <circle cx="200" cy="195" r="121" fill="none" stroke="#6b84e8" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>
  <!-- lampes de touche -->
  <circle cx="54" cy="195" r="13" fill="#2ee86b" opacity=".2"/><circle cx="54" cy="195" r="7" fill="#2ee86b"/><circle cx="52" cy="193" r="2.2" fill="#fff" opacity=".8"/>
  <circle cx="346" cy="195" r="13" fill="#ff3b5c" opacity=".2"/><circle cx="346" cy="195" r="7" fill="#ff3b5c"/><circle cx="344" cy="193" r="2.2" fill="#fff" opacity=".8"/>
  
  <!-- fleuret : garde en bas à droite, pointe en haut à gauche -->
  <polygon points="88,83 92,81 298,293 292,299" fill="url(#steel)"/>
  <circle cx="88" cy="82" r="3.5" fill="#c3cad6"/>
  <line x1="306" y1="306" x2="324" y2="324" stroke="#2a2a2e" stroke-width="8" stroke-linecap="round"/>
  <line x1="309" y1="309" x2="321" y2="321" stroke="#4a4a50" stroke-width="8" stroke-dasharray="1.5 2.5"/>
  <circle cx="328" cy="328" r="7" fill="url(#steel)" stroke="#5d6676" stroke-width="1.2"/>
  <ellipse cx="300" cy="300" rx="27" ry="10" transform="rotate(-45 300 300)" fill="url(#steel)" stroke="#5d6676" stroke-width="1.5"/>
  <!-- sabre laser : poignée en bas à gauche, lame vers haut droite -->
  <g stroke-linecap="round">
    <line x1="104" y1="290" x2="312" y2="82" stroke="#ff2d55" stroke-width="24" opacity=".15"/>
    <line x1="104" y1="290" x2="312" y2="82" stroke="#ff2d55" stroke-width="13" opacity=".45"/>
    <line x1="104" y1="290" x2="312" y2="82" stroke="#ff3b5c" stroke-width="7"/>
    <line x1="106" y1="288" x2="310" y2="84" stroke="#fff4f6" stroke-width="2.6"/>
  </g>
  <g transform="rotate(-45 90 304)">
    <rect x="68" y="296" width="46" height="16" rx="3" fill="url(#steel)" stroke="#5d6676" stroke-width="1.2"/>
    <rect x="76" y="296" width="3" height="16" fill="#2a2a2e"/><rect x="82" y="296" width="3" height="16" fill="#2a2a2e"/><rect x="88" y="296" width="3" height="16" fill="#2a2a2e"/>
    <rect x="112" y="293" width="8" height="22" rx="2" fill="#5d6676"/>
    <circle cx="100" cy="304" r="2.6" fill="#ff3b5c"/>
  </g>
  <!-- bavette -->
  <path d="M158 222 L242 222 L258 274 Q200 294 142 274 Z" fill="#f4f6fa" stroke="#c3cad6" stroke-width="1.5"/>
  <path d="M146 268 Q200 286 254 268" fill="none" stroke="#ff3b5c" stroke-width="1.6" stroke-dasharray="4 3"/>
  <!-- crête de coq -->
  <path d="M168 128 C158 104 176 90 186 106 C182 82 208 78 206 100 C214 80 238 88 228 110 C240 108 242 124 232 130 Z" fill="#e63950" stroke="#7a1229" stroke-width="2"/>
  <!-- masque -->
  <path d="M150 152 C150 106 250 106 250 152 L246 214 C243 248 157 248 154 214 Z" fill="#0b1630"/>
  <path d="M150 152 C150 106 250 106 250 152 L246 214 C243 248 157 248 154 214 Z" fill="url(#mesh)"/>
  <path d="M150 152 C150 106 250 106 250 152 L246 214 C243 248 157 248 154 214 Z" fill="none" stroke="url(#steel)" stroke-width="5"/>
  <path d="M166 134 C176 116 200 112 214 116" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  <!-- tête de coq sur le grillage -->
  <path d="M166 148 L190 158" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/>
  <path d="M234 148 L210 158" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="168" r="9" fill="#ffffff"/><circle cx="182" cy="170" r="4.5" fill="#0b1630"/><circle cx="180.5" cy="168" r="1.5" fill="#ffffff"/>
  <circle cx="220" cy="168" r="9" fill="#ffffff"/><circle cx="218" cy="170" r="4.5" fill="#0b1630"/><circle cx="216.5" cy="168" r="1.5" fill="#ffffff"/>
  <path d="M194 200 C186 224 204 230 203 212 C210 226 216 206 207 198 Z" fill="#e63950" stroke="#7a1229" stroke-width="1.5"/>
  <path d="M186 180 L214 180 L200 206 Z" fill="#ffb703" stroke="#c77700" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M189 187 L211 187" stroke="#c77700" stroke-width="1.5"/>
  <text x="200" y="420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="3" fill="#ffffff">BELLEPOULE</text>
  <text x="200" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="16" fill="#6b84e8">MODERN</text>
</svg>
