name: Quality checks

# Workflow réutilisable : contrôles qualité communs aux PR vers dev
# (pr-quality.yml), au push sur dev (build-dev.yml) et sur main (build.yml).
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 5s before retry..."
            [ $i -lt 3 ] && sleep 5
          done || exit 1

      - name: Type check
        run: npm run type-check

      - name: i18n completeness
        run: npm run check:i18n

      - name: Tests documentation up to date
        run: npm run check:tests-doc

      - name: i18n documentation up to date
        run: npm run check:i18n-doc

      - name: Socket.IO events documentation up to date
        run: npm run check:socket-doc

      - name: Quality ratchet (hardcoded strings, any, console)
        run: npm run check:quality

      - name: Unit tests
        run: npm run test:run

      - name: Bundle size budget
        run: |
          npm run build:renderer
          node scripts/check-bundle-size.js
