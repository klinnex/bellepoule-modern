name: Security audit

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Non bloquant au début (#1150) : passer continue-on-error à false une fois la dette traitée
      - name: npm audit (prod, high+)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: SBOM CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-file sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
