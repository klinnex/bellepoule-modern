name: E2E

# Workflow réutilisable : tests E2E Playwright (#2045), appelé par pr-quality.yml.
# Projets : chromium (interface servie par le dev server Webpack) et electron
# (application construite, profil vierge). Sous Linux sans écran : xvfb-run.
on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 5s before retry..."
            [ $i -lt 3 ] && sleep 5
          done || exit 1

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # pretest:e2e construit l'application (npm run build) pour le projet electron
      - name: E2E (browser + Electron)
        run: xvfb-run -a npm run test:e2e -- --reporter=github,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
