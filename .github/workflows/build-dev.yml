      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.mac.artifactName = '\${productName}-dev-\${version}-\${arch}.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --arm64 && break
            [ $i -lt 3 ] && sleep 30
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg-dev
          path: release/*-dev-*-arm64.dmg
          retention-days: 7

  build-linux-x64:
    needs: [increment-version, quality]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Update version files
        run: |
          node -e "const fs=require('fs');const v='${{ needs.increment-version.outputs.version }}';const b=${{ needs.increment-version.outputs.build }};const f='${{ needs.increment-version.outputs.full_version }}';fs.writeFileSync('version.json',JSON.stringify({version:v,build:b,date:new Date().toISOString()},null,2));const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=f;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
