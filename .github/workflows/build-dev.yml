name: Build Dev Branch

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Un seul build dev à la fois : le compteur de build doit rester strictement croissant
concurrency:
  group: build-dev
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 5s before retry..."
            [ $i -lt 3 ] && sleep 5
          done || exit 1

      - name: Type check
        run: npm run type-check

      - name: i18n completeness
        run: npm run check:i18n

      - name: Tests documentation up to date
        run: npm run check:tests-doc

      - name: i18n documentation up to date
        run: npm run check:i18n-doc

      - name: Socket.IO events documentation up to date
        run: npm run check:socket-doc

      - name: Quality ratchet (hardcoded strings, any, console)
        run: npm run check:quality

      - name: Unit tests
        run: npm run test:run

      - name: Bundle size budget
        run: |
          npm run build:renderer
          node scripts/check-bundle-size.js

  increment-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      full_version: ${{ steps.version.outputs.full_version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Next build number
        id: version
        run: |
          # Compteur de build unique, porté par version.json (cf. docs/VERSIONING.md)
          node scripts/version.js next-build
          node scripts/version.js meta dev --github-output

      - name: Commit and push
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json
          git commit -m "🔖 Dev Build #${{ steps.version.outputs.build }}"
          for i in 1 2 3; do
            if git push origin HEAD:dev; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin dev
          done
          echo "::error::Impossible de pousser le numéro de build"
          exit 1

  build-windows:
    needs: [increment-version, quality]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.increment-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply dev version
        run: node scripts/version.js apply dev --build ${{ needs.increment-version.outputs.build }}

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --win portable --x64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-dev
          path: release/*.exe
          retention-days: 7

  build-macos-x64:
    needs: [increment-version, quality]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.increment-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply dev version
        run: node scripts/version.js apply dev --build ${{ needs.increment-version.outputs.build }}

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --x64 && break
            [ $i -lt 3 ] && sleep 30
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-dmg-dev
          path: release/*-mac-x64.dmg
          retention-days: 7

  build-macos-arm64:
    needs: [increment-version, quality]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.increment-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply dev version
        run: node scripts/version.js apply dev --build ${{ needs.increment-version.outputs.build }}

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --arm64 && break
            [ $i -lt 3 ] && sleep 30
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg-dev
          path: release/*-mac-arm64.dmg
          retention-days: 7

  build-linux-x64:
    needs: [increment-version, quality]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.increment-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply dev version
        run: node scripts/version.js apply dev --build ${{ needs.increment-version.outputs.build }}

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --linux AppImage --x64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-appimage-dev
          path: release/*.AppImage
          retention-days: 7

  build-linux-arm64:
    needs: [increment-version, quality]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.increment-version.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            echo "npm ci failed, trying npm install..."
            npm install && break
            echo "Failed, waiting 10s before retry..."
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply dev version
        run: node scripts/version.js apply dev --build ${{ needs.increment-version.outputs.build }}

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --linux AppImage --arm64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage-dev
          path: release/*.AppImage
          retention-days: 7
          if-no-files-found: warn

  create-dev-release:
    needs:
      [
        increment-version,
        build-windows,
        build-macos-x64,
        build-macos-arm64,
        build-linux-x64,
        build-linux-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: builds

      - name: List downloaded files
        run: find builds -type f

      - name: Create Dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.increment-version.outputs.tag }}
          TITLE: ${{ needs.increment-version.outputs.title }}
          FULL_VERSION: ${{ needs.increment-version.outputs.full_version }}
          SHA: ${{ needs.increment-version.outputs.sha }}
        run: |
          mapfile -t FILES < <(find builds -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \))
          NOTES="## 🧪 Version de développement

          **Version** : \`${FULL_VERSION}\` • **Build** : \`#${{ needs.increment-version.outputs.build }}\`

          Pré-release construite depuis la branche \`dev\`, destinée aux tests.
          Prochaine version stable visée : \`${{ needs.increment-version.outputs.version }}\`.

          ### 📥 Téléchargements

          | Plateforme | Architecture | Fichier |
          |------------|--------------|---------|
          | **Windows** | x64 | \`BellePoule-Modern-${FULL_VERSION}-win-x64-portable.exe\` |
          | **macOS** | x64 | \`BellePoule-Modern-${FULL_VERSION}-mac-x64.dmg\` |
          | **macOS** | ARM64 | \`BellePoule-Modern-${FULL_VERSION}-mac-arm64.dmg\` (Apple Silicon) |
          | **Linux** | x64 | \`…-linux-x64.AppImage\` |
          | **Linux** | ARM64 | \`…-linux-arm64.AppImage\` (Raspberry Pi…) |

          ### ⚠️ Notes
          - Peut contenir des bugs ; ne pas utiliser en compétition officielle
          - Règles de versionnage : [docs/VERSIONING.md](https://github.com/${REPO}/blob/dev/docs/VERSIONING.md)

          ---
          **Build automatique** • Branche : \`dev\` • Commit : \`${SHA}\`"

          echo "Création de la pré-release $TAG"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --latest=false \
            --target "$SHA" \
            "${FILES[@]}"

          # Conserver les 5 pré-releases dev les plus récentes (tags vX.Y.Z-dev.N et anciens dev-build-N)
          gh api "repos/$REPO/releases?per_page=100" --paginate 2>/dev/null \
            | jq -r '.[] | select(.prerelease==true)
                     | select((.tag_name | test("-dev\\.[0-9]+$")) or (.tag_name | startswith("dev-build-")))
                     | "\(.created_at) \(.id) \(.tag_name)"' \
            | sort -r | tail -n +6 \
            | while read -r _ id tag; do
                echo "Suppression de l'ancienne pré-release $tag ($id)"
                gh api -X DELETE "repos/$REPO/releases/$id" || true
                gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || true
              done
