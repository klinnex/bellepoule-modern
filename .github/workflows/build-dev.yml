      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --linux AppImage --arm64 && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage-dev
          path: release/*-dev-*.AppImage
          retention-days: 7
          if-no-files-found: warn

  create-dev-release:
    needs:
      [
        increment-version,
        build-windows,
        build-macos-x64,
        build-macos-arm64,
        build-linux-x64,
        build-linux-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: builds

      - name: List downloaded files
        run: find builds -type f

      - name: Create or Update Dev Release via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mapfile -t FILES < <(find builds -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \))
          NOTES="## 🧪 Version de Développement

          **Version**: \`${{ needs.increment-version.outputs.version }}\`
          **Build**: \`#${{ needs.increment-version.outputs.build }}\`

          **Ceci est une version de test !**

          Cette release contient les dernières modifications de la branche \`dev\` et est destinée aux tests.

          ### 📥 Téléchargements

          | Plateforme | Architecture | Fichier |
          |------------|--------------|---------|
          | **Windows** | x64 | \`.exe\` portable |
          | **macOS** | x64 | \`.dmg\` |
          | **macOS** | ARM64 | \`.dmg\` (Apple Silicon M1/M2/M3) |
          | **Linux** | x64 | \`.AppImage\` |
          | **Linux** | ARM64 | \`.AppImage\` (Raspberry Pi, etc.) |

          ### ⚠️ Notes
          - Cette version peut contenir des bugs
          - Les fonctionnalités sont en cours de développement

          ---
          **Build automatique** • Branche: \`dev\` • Commit: \`${{ github.sha }}\`"

          TITLE="🧪 BellePoule Modern Dev v${{ needs.increment-version.outputs.version }} Build #${{ needs.increment-version.outputs.build }}"

          echo "=== All releases ==="
          gh api repos/$REPO/releases --paginate 2>/dev/null | jq -r '.[] | "\(.id) \(.tag_name)"'
          echo "=== Tag lookup ==="
          gh api repos/$REPO/releases/tags/dev-prerelease 2>&1 | jq '.' || true
          TAG="dev-build-${{ needs.increment-version.outputs.build }}"
          echo "Creating release with tag $TAG"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --target dev \
            "${FILES[@]}"

          # Keep only the 5 most recent dev builds (cleanup old ones)
          gh api repos/$REPO/releases --paginate 2>/dev/null \
            | jq -r '.[] | select(.prerelease==true) | "\(.id) \(.tag_name)"' \
            | grep " dev-build-" | sort -t- -k3 -rn | tail -n +6 \
            | while read id tag; do
                echo "Cleaning up old release $tag ($id)"
                gh api -X DELETE repos/$REPO/releases/$id || true
                gh api -X DELETE repos/$REPO/git/refs/tags/$tag || true
              done
