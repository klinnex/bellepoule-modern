name: Build Dev Release

on:
  push:
    branches: [dev-1.1.1]
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Timeout plus court pour éviter les problèmes
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --production  # Installation plus rapide

      - name: Build
        run: npm run build

      # Build Linux uniquement (pas besoin de Wine)
      - name: Build Linux
        run: npx electron-builder --linux AppImage --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dev Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-latest
          name: "🚀 BellePoule Modern - Development Build"
          body: |
            ## 🛠️ Development Build
            
            **Branche** : `dev-1.1.1`
            
            Version de développement rapide - Linux uniquement.
            
            ### 📥 Téléchargement
            | Plateforme | Fichier |
            |------------|---------|
            | **Linux** | `.AppImage` |
            
            ### ⚠️ Notes
            - Version de développement : peut contenir des bugs
            - Reportez les problèmes sur GitHub Issues
            
            ### 🆕 Nouveautés
            - Port de connexion distante configurable (défaut: 8066)
            - Génération de QR code pour connexion tablette
            - Affichage de l'URL avec IP pour connexion facile
          files: |
            release/*.AppImage
          draft: false
          prerelease: true
          generate_release_notes: false  # Plus rapide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}