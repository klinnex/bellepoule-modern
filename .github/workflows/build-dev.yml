      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Update package.json for dev build
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.mac.artifactName = '\${productName}-dev-\${version}-\${arch}.\${ext}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --x64 && break
            [ $i -lt 3 ] && sleep 30
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-dmg-dev
          path: release/*-dev-*-x64.dmg
          retention-days: 7

  build-macos-arm64:
