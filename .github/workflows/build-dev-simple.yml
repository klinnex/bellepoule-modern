name: Build Dev Release (Simple)

on:
  push:
    branches: [dev-1.1.1]
  workflow_dispatch:

jobs:
  build-dev-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Linux Only
        run: npx electron-builder --linux AppImage --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: dev-latest
          name: "🚀 BellePoule Modern - Development Build #${{ github.run_number }}"
          body: |
            Development build for testing.
            
            **Branche** : dev-1.1.1
            **Build** : #${{ github.run_number }}
            
            ### 🆕 Nouveautés
            - Port de connexion distante configurable (défaut: 8066)
            - Génération de QR code pour connexion tablette
            - Affichage de l'URL avec IP pour connexion facile
          files: release/*.AppImage
          draft: false
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}