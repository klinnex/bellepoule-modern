name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  increment-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increment Version
        id: version
        run: |
          if [ -f version.json ]; then
            VERSION=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
            BUILD=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
          else
            VERSION="1.0.0"
            BUILD=0
          fi

          NEW_BUILD=$((BUILD + 1))
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "{" > version.json
          echo "  \"version\": \"$VERSION\"," >> version.json
          echo "  \"build\": $NEW_BUILD," >> version.json
          echo "  \"date\": \"$DATE\"" >> version.json
          echo "}" >> version.json

          FULL_VERSION="${VERSION}-build.${NEW_BUILD}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$FULL_VERSION\"/" package.json

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$NEW_BUILD" >> $GITHUB_OUTPUT

          cat version.json

      - name: Commit Version Update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add version.json package.json
          git diff --staged --quiet || git commit -m "🔖 Build #${{ steps.version.outputs.build }}"
          git push || echo "Nothing to push"

  build-windows:
    needs: increment-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version files
        run: |
          # Attendre que le commit de version soit propagé
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5 to pull latest version..."
            git fetch origin main
            git reset --hard origin/main
            # Vérifier si on a le bon build
            if [ -f version.json ]; then
              BUILD=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
              EXPECTED="${{ needs.increment-version.outputs.build }}"
              echo "Current build: $BUILD, Expected: $EXPECTED"
              if [ "$BUILD" = "$EXPECTED" ]; then
                echo "✅ Version synced!"
                exit 0
              fi
            fi
            [ $i -lt 5 ] && sleep 5
          done
          echo "⚠️ Could not sync version, using latest available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe
          retention-days: 5

  build-macos-x64:
    needs: increment-version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version files
        run: |
          # Attendre que le commit de version soit propagé
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5 to pull latest version..."
            git fetch origin main
            git reset --hard origin/main
            # Vérifier si on a le bon build
            if [ -f version.json ]; then
              BUILD=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
              EXPECTED="${{ needs.increment-version.outputs.build }}"
              echo "Current build: $BUILD, Expected: $EXPECTED"
              if [ "$BUILD" = "$EXPECTED" ]; then
                echo "✅ Version synced!"
                exit 0
              fi
            fi
            [ $i -lt 5 ] && sleep 5
          done
          echo "⚠️ Could not sync version, using latest available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: release/*.dmg
          retention-days: 5

  build-macos-arm64:
    needs: increment-version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version files
        run: |
          # Attendre que le commit de version soit propagé
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5 to pull latest version..."
            git fetch origin main
            git reset --hard origin/main
            # Vérifier si on a le bon build
            if [ -f version.json ]; then
              BUILD=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
              EXPECTED="${{ needs.increment-version.outputs.build }}"
              echo "Current build: $BUILD, Expected: $EXPECTED"
              if [ "$BUILD" = "$EXPECTED" ]; then
                echo "✅ Version synced!"
                exit 0
              fi
            fi
            [ $i -lt 5 ] && sleep 5
          done
          echo "⚠️ Could not sync version, using latest available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: release/*.dmg
          retention-days: 5

  build-linux-x64:
    needs: increment-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version files
        run: |
          # Attendre que le commit de version soit propagé
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5 to pull latest version..."
            git fetch origin main
            git reset --hard origin/main
            # Vérifier si on a le bon build
            if [ -f version.json ]; then
              BUILD=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
              EXPECTED="${{ needs.increment-version.outputs.build }}"
              echo "Current build: $BUILD, Expected: $EXPECTED"
              if [ "$BUILD" = "$EXPECTED" ]; then
                echo "✅ Version synced!"
                exit 0
              fi
            fi
            [ $i -lt 5 ] && sleep 5
          done
          echo "⚠️ Could not sync version, using latest available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --linux AppImage --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-appimage
          path: release/*.AppImage
          retention-days: 5

  build-linux-arm64:
    needs: increment-version
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version files
        run: |
          # Attendre que le commit de version soit propagé
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5 to pull latest version..."
            git fetch origin main
            git reset --hard origin/main
            # Vérifier si on a le bon build
            if [ -f version.json ]; then
              BUILD=$(cat version.json | python3 -c "import sys,json; print(json.load(sys.stdin)['build'])")
              EXPECTED="${{ needs.increment-version.outputs.build }}"
              echo "Current build: $BUILD, Expected: $EXPECTED"
              if [ "$BUILD" = "$EXPECTED" ]; then
                echo "✅ Version synced!"
                exit 0
              fi
            fi
            [ $i -lt 5 ] && sleep 5
          done
          echo "⚠️ Could not sync version, using latest available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --linux AppImage --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-appimage
          path: release/*.AppImage
          retention-days: 5
          if-no-files-found: warn

  create-release:
    needs:
      [
        increment-version,
        build-windows,
        build-macos-x64,
        build-macos-arm64,
        build-linux-x64,
        build-linux-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: List downloaded files
        run: find builds -type f

      - name: Delete all existing releases
        run: |
          # Supprimer toutes les releases pour ne conserver que la nouvelle
          tags=$(gh release list --repo "${{ github.repository }}" --json tagName -q '.[].tagName' 2>/dev/null || true)
          if [ -n "$tags" ]; then
            echo "$tags" | while read -r tag; do
              echo "Suppression de la release: $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
            done
          fi
          # Nettoyer le tag 'latest' orphelin s'il reste
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/latest" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: '🚀 BellePoule Modern v${{ needs.increment-version.outputs.version }} Build #${{ needs.increment-version.outputs.build }}'
          body: |
            ## BellePoule Modern

            **Version**: `${{ needs.increment-version.outputs.version }}`
            **Build**: `#${{ needs.increment-version.outputs.build }}`

            ### 📥 Téléchargements
            | Plateforme | Architecture | Fichier |
            |------------|--------------|---------|
            | **Windows** | x64 | `.exe` portable |
            | **macOS** | x64 | `.dmg` |
            | **macOS** | ARM64 | `.dmg` (Apple Silicon M1/M2/M3) |
            | **Linux** | x64 | `.AppImage` |
            | **Linux** | ARM64 | `.AppImage` (Raspberry Pi, etc.) |

            ### 📋 Voir la version
            Menu **Aide > À propos** ou **F1**
          files: |
            builds/windows-exe/*.exe
            builds/macos-x64-dmg/*.dmg
            builds/macos-arm64-dmg/*.dmg
            builds/linux-x64-appimage/*.AppImage
            builds/linux-arm64-appimage/*.AppImage
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
