name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: i18n completeness
        run: npm run check:i18n

      - name: Tests documentation up to date
        run: npm run check:tests-doc

      - name: Unit tests
        run: npm run test:run

      - name: Bundle size budget
        run: |
          npm run build:renderer
          node scripts/check-bundle-size.js

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}

    steps:
      - uses: actions/checkout@v6

      # Pas de nouveau numéro de build : la release stable reprend le build dev promu
      # (cf. docs/VERSIONING.md). Aucun commit n'est poussé sur main.
      - name: Read version
        id: version
        run: node scripts/version.js meta stable --github-output

      - name: Ensure version was bumped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Le tag $TAG existe déjà. Bumper la version sur dev (npm run version:bump -- patch|minor|major) avant de promouvoir vers main."
            exit 1
          fi
  build-windows:
    needs: [version, quality]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply stable version
        run: node scripts/version.js apply stable

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: release/*.exe
          retention-days: 5

  build-macos-x64:
    needs: [version, quality]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply stable version
        run: node scripts/version.js apply stable

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --x64 && break
            [ $i -lt 3 ] && sleep 30
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-dmg
          path: release/*.dmg
          retention-days: 5

  build-macos-arm64:
    needs: [version, quality]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache electron-builder
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply stable version
        run: node scripts/version.js apply stable

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npx electron-builder --mac --arm64 && break
            [ $i -lt 3 ] && sleep 30
          done || exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ~/Library/Caches/electron
          ELECTRON_BUILDER_CACHE: ~/Library/Caches/electron-builder

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-dmg
          path: release/*.dmg
          retention-days: 5

  build-linux-x64:
    needs: [version, quality]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply stable version
        run: node scripts/version.js apply stable

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --linux AppImage --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64-appimage
          path: release/*.AppImage
          retention-days: 5

  build-linux-arm64:
    needs: [version, quality]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            npm ci && break
            npm install && break
            [ $i -lt 3 ] && sleep 10
          done || exit 1

      - name: Apply stable version
        run: node scripts/version.js apply stable

      - name: Build TypeScript and Webpack
        run: npm run build:ci

      - name: Package with Electron Builder
        run: npx electron-builder --linux AppImage --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-appimage
          path: release/*.AppImage
          retention-days: 5
          if-no-files-found: warn

  create-release:
    needs:
      [
        version,
        build-windows,
        build-macos-x64,
        build-macos-arm64,
        build-linux-x64,
        build-linux-arm64,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: builds

      - name: List downloaded files
        run: find builds -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ${{ needs.version.outputs.title }}
          body: |
            ## BellePoule Modern ${{ needs.version.outputs.version }}

            **Version** : `${{ needs.version.outputs.version }}` • **Build** : `#${{ needs.version.outputs.build }}`

            Version stable, promue depuis le build dev `v${{ needs.version.outputs.version }}-dev.${{ needs.version.outputs.build }}`.

            ### 📥 Téléchargements

            | Plateforme | Architecture | Fichier |
            |------------|--------------|---------|
            | **Windows** | x64 | `BellePoule-Modern-${{ needs.version.outputs.version }}-win-x64-portable.exe` |
            | **macOS** | x64 | `BellePoule-Modern-${{ needs.version.outputs.version }}-mac-x64.dmg` |
            | **macOS** | ARM64 | `BellePoule-Modern-${{ needs.version.outputs.version }}-mac-arm64.dmg` (Apple Silicon) |
            | **Linux** | x64 | `…-linux-x64.AppImage` |
            | **Linux** | ARM64 | `…-linux-arm64.AppImage` (Raspberry Pi…) |

            ### 📋 Voir la version
            Menu **Aide > À propos** ou **F1**

            Règles de versionnage : [docs/VERSIONING.md](https://github.com/${{ github.repository }}/blob/main/docs/VERSIONING.md)
          files: |
            builds/windows-exe/*.exe
            builds/macos-x64-dmg/*-x64.dmg
            builds/macos-arm64-dmg/*-arm64.dmg
            builds/linux-x64-appimage/*.AppImage
            builds/linux-arm64-appimage/*.AppImage
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Les releases stables vX.Y.Z sont conservées. Seules les anciennes releases
      # au format historique vX.Y.Z-build.N sont retirées (leurs tags restent).
      - name: Remove legacy build releases
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease | not) | .tagName' \
            | grep -E -- '-build\.[0-9]+$' \
            | while read -r tag; do
                echo "Suppression de l'ancienne release : $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes || true
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
