<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arène BellePoule</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        color: #fff;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: rgba(0, 0, 0, 0.4);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(10px);
      }

      .arena-title {
        font-size: 2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .arena-title span {
        font-size: 2.5rem;
      }

      .status-section {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }

      .match-status-badge {
        padding: 0.75rem 1.5rem;
        border-radius: 2rem;
        font-weight: 700;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .status-waiting {
        background: #6b7280;
      }
      .status-progress {
        background: #22c55e;
        animation: pulse-status 2s infinite;
      }
      .status-finished {
        background: #f59e0b;
      }

      @keyframes pulse-status {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }
        50% {
          opacity: 0.8;
          box-shadow: 0 0 40px rgba(34, 197, 94, 0.8);
        }
      }

      .connection-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .connection-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ef4444;
        animation: pulse 2s infinite;
      }

      .connection-dot.connected {
        background: #22c55e;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        gap: 2rem;
      }

      /* Affichage du match */
      .match-display {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 1.5rem;
        padding: 3rem;
        width: 100%;
        max-width: 1200px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        display: none;
      }

      .match-display.active {
        display: block;
      }

      .fencers-row {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 2rem;
        align-items: center;
      }

      .fencer-display {
        text-align: center;
        padding: 2rem;
        border-radius: 1rem;
        border: 4px solid transparent;
        transition: all 0.3s;
      }

      .fencer-display.red-side {
        background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
        border-color: #dc2626;
      }

      .fencer-display.green-side {
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        border-color: #16a34a;
      }

      .color-badge {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        margin: 0 auto 1rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .color-badge.red {
        background: linear-gradient(135deg, #ef4444, #dc2626);
      }

      .color-badge.green {
        background: linear-gradient(135deg, #22c55e, #16a34a);
      }

      .fencer-name {
        font-size: 2.5rem;
        font-weight: 800;
        color: #1f2937;
        margin-bottom: 0.5rem;
      }

      .fencer-club {
        font-size: 1.25rem;
        color: #6b7280;
        margin-bottom: 1.5rem;
        font-weight: 500;
      }

      /* Cartons */
      .cards-container {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        min-height: 45px;
      }

      .card {
        width: 35px;
        height: 45px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.1rem;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        animation: card-appear 0.3s ease-out;
      }

      @keyframes card-appear {
        from {
          transform: scale(0) rotate(-10deg);
          opacity: 0;
        }
        to {
          transform: scale(1) rotate(0);
          opacity: 1;
        }
      }

      .card-white {
        background: #f3f4f6;
        color: #374151;
        border: 2px solid #9ca3af;
      }

      .card-yellow {
        background: #fbbf24;
        color: #92400e;
        border: 2px solid #d97706;
      }

      .card-red {
        background: #ef4444;
        color: white;
        border: 2px solid #dc2626;
      }

      .score-big {
        font-size: 8rem;
        font-weight: 900;
        line-height: 1;
      }

      .score-big.red {
        color: #dc2626;
        text-shadow: 2px 2px 4px rgba(220, 38, 38, 0.3);
      }

      .score-big.green {
        color: #16a34a;
        text-shadow: 2px 2px 4px rgba(22, 163, 74, 0.3);
      }

      .vs-divider {
        font-size: 3rem;
        font-weight: 900;
        color: #ef4444;
        text-shadow: 2px 2px 4px rgba(239, 68, 68, 0.3);
      }

      /* Chronomètre */
      .timer-section {
        margin-top: 2rem;
        text-align: center;
      }

      .timer-display {
        display: inline-block;
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        padding: 1.5rem 3rem;
        border-radius: 1rem;
        font-size: 6rem;
        font-weight: 900;
        font-family: 'Courier New', monospace;
        color: #fff;
        text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        letter-spacing: 0.15em;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 4px solid transparent;
        transition: all 0.3s;
      }

      .timer-display.running {
        border-color: #22c55e;
        color: #22c55e;
        text-shadow: 0 0 40px rgba(34, 197, 94, 0.6);
      }

      .timer-display.paused {
        border-color: #fbbf24;
        color: #fbbf24;
        text-shadow: 0 0 40px rgba(251, 191, 36, 0.6);
      }

      .timer-display.warning {
        color: #fbbf24;
        animation: timer-pulse 1s infinite;
      }

      .timer-display.danger {
        color: #ef4444;
        animation: timer-pulse 0.5s infinite;
      }

      @keyframes timer-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.02);
        }
      }

      .timer-label {
        font-size: 1.1rem;
        color: #6b7280;
        margin-top: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* Écran d'attente */
      .waiting-screen {
        text-align: center;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .waiting-screen.hidden {
        display: none;
      }

      .waiting-icon {
        font-size: 6rem;
        opacity: 0.8;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .waiting-text {
        font-size: 2rem;
        font-weight: 600;
        opacity: 0.9;
      }

      .waiting-subtext {
        font-size: 1.1rem;
        opacity: 0.6;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .fencers-row {
          grid-template-columns: 1fr;
          gap: 1rem;
        }

        .vs-divider {
          transform: rotate(90deg);
          margin: 0.5rem 0;
        }

        .fencer-name {
          font-size: 1.5rem;
        }

        .score-big {
          font-size: 5rem;
        }

        .timer-display {
          font-size: 4rem;
          padding: 1rem 2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="arena-title">
        <span>⚔️</span>
        <span>Arène <span id="arena-number">1</span></span>
      </div>
      <div class="status-section">
        <div class="match-status-badge status-waiting" id="match-status">En attente</div>
        <div class="connection-indicator">
          <div id="connection-dot" class="connection-dot"></div>
          <span id="connection-text">Connexion...</span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <!-- Écran d'attente -->
      <div class="waiting-screen" id="waiting-screen">
        <div class="waiting-icon">🤺</div>
        <div class="waiting-text">En attente du prochain match</div>
        <div class="waiting-subtext">L'arbitre va bientôt démarrer un match</div>
      </div>

      <!-- Affichage du match -->
      <div class="match-display" id="match-display">
        <div class="fencers-row">
          <!-- Tireur A (Rouge) -->
          <div class="fencer-display red-side">
            <div class="color-badge red"></div>
            <div class="fencer-name" id="fencer-a-name">-</div>
            <div class="fencer-club" id="fencer-a-club">-</div>
            <div class="cards-container" id="fencer-a-cards"></div>
            <div class="score-big red" id="score-a">0</div>
          </div>

          <!-- VS -->
          <div class="vs-divider">VS</div>

          <!-- Tireur B (Vert) -->
          <div class="fencer-display green-side">
            <div class="color-badge green"></div>
            <div class="fencer-name" id="fencer-b-name">-</div>
            <div class="fencer-club" id="fencer-b-club">-</div>
            <div class="cards-container" id="fencer-b-cards"></div>
            <div class="score-big green" id="score-b">0</div>
          </div>
        </div>

        <!-- Chronomètre -->
        <div class="timer-section">
          <div class="timer-display" id="timer-display">03:00</div>
          <div class="timer-label">Temps restant</div>
        </div>
      </div>
    </div>

    <script>
      class ArenaDisplay {
        constructor() {
          this.socket = io();
          this.arenaId = this.getArenaId();
          this.arenaNumber = this.arenaNumberFromId();
          this.currentMatch = null;
          this.timerSeconds = 180;
          this.matchStatus = 'idle';
          this.cardsA = [];
          this.cardsB = [];

          this.init();
        }

        getArenaId() {
          const path = window.location.pathname;
          const match = path.match(/arene(\d+)/i) || path.match(/arena(\d+)/i);
          return match ? `arena${match[1]}` : 'arena1';
        }

        arenaNumberFromId() {
          return this.arenaId.replace('arena', '');
        }

        init() {
          document.getElementById('arena-number').textContent = this.arenaNumber;
          this.setupSocketListeners();
        }

        setupSocketListeners() {
          this.socket.on('connect', () => {
            this.updateConnectionStatus(true);
            this.socket.emit('join_arena', { arenaId: this.arenaId, role: 'display' });
          });

          this.socket.on('disconnect', () => {
            this.updateConnectionStatus(false);
          });

          this.socket.on(`arena:${this.arenaId}:update`, data => {
            this.handleArenaUpdate(data);
          });
        }

        updateConnectionStatus(connected) {
          const dot = document.getElementById('connection-dot');
          const text = document.getElementById('connection-text');

          if (connected) {
            dot.classList.add('connected');
            text.textContent = 'Connecté';
          } else {
            dot.classList.remove('connected');
            text.textContent = 'Déconnecté';
          }
        }

        handleArenaUpdate(data) {
          // Mise à jour du statut
          if (data.status) {
            this.matchStatus = data.status;
            this.updateStatusBadge();
          }

          // Mise à jour du match
          if (data.match) {
            this.currentMatch = data.match;
            this.updateMatchDisplay();
          }

          // Mise à jour des scores
          if (data.scoreA !== undefined) {
            document.getElementById('score-a').textContent = data.scoreA;
          }
          if (data.scoreB !== undefined) {
            document.getElementById('score-b').textContent = data.scoreB;
          }

          // Mise à jour des cartons
          if (data.cardsA) {
            this.cardsA = data.cardsA;
            this.updateCardsDisplay();
          }
          if (data.cardsB) {
            this.cardsB = data.cardsB;
            this.updateCardsDisplay();
          }

          // Mise à jour du timer
          if (data.time !== undefined) {
            this.timerSeconds = data.time;
            this.updateTimerDisplay(data.timerStatus);
          }

          // Afficher/masquer selon le statut
          this.updateVisibility();
        }

        updateStatusBadge() {
          const badge = document.getElementById('match-status');
          badge.className = 'match-status-badge';

          switch (this.matchStatus) {
            case 'idle':
            case 'not_started':
              badge.textContent = 'En attente';
              badge.classList.add('status-waiting');
              break;
            case 'ready':
            case 'in_progress':
              badge.textContent = 'En cours';
              badge.classList.add('status-progress');
              break;
            case 'finished':
              badge.textContent = 'Terminé';
              badge.classList.add('status-finished');
              break;
          }
        }

        updateMatchDisplay() {
          if (!this.currentMatch) return;

          const fencerA = this.currentMatch.fencerA || {};
          const fencerB = this.currentMatch.fencerB || {};

          document.getElementById('fencer-a-name').textContent =
            `${fencerA.lastName || ''} ${fencerA.firstName || ''}`.trim() || '-';
          document.getElementById('fencer-a-club').textContent = fencerA.club || '';

          document.getElementById('fencer-b-name').textContent =
            `${fencerB.lastName || ''} ${fencerB.firstName || ''}`.trim() || '-';
          document.getElementById('fencer-b-club').textContent = fencerB.club || '';

          document.getElementById('score-a').textContent = this.currentMatch.scoreA || 0;
          document.getElementById('score-b').textContent = this.currentMatch.scoreB || 0;
        }

        updateCardsDisplay() {
          const renderCards = cards =>
            cards
              .map(
                card =>
                  `<div class="card card-${card}">${card === 'white' ? 'B' : card === 'yellow' ? 'J' : 'R'}</div>`
              )
              .join('');

          document.getElementById('fencer-a-cards').innerHTML = renderCards(this.cardsA);
          document.getElementById('fencer-b-cards').innerHTML = renderCards(this.cardsB);
        }

        updateTimerDisplay(timerStatus) {
          const minutes = Math.floor(this.timerSeconds / 60);
          const seconds = this.timerSeconds % 60;
          const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

          const timerEl = document.getElementById('timer-display');
          timerEl.textContent = display;

          // Reset classes
          timerEl.className = 'timer-display';

          // Status classes
          if (timerStatus === 'running') {
            timerEl.classList.add('running');
          } else if (timerStatus === 'paused') {
            timerEl.classList.add('paused');
          }

          // Time warning classes
          if (this.timerSeconds <= 10) {
            timerEl.classList.add('danger');
          } else if (this.timerSeconds <= 30) {
            timerEl.classList.add('warning');
          }
        }

        updateVisibility() {
          const waitingScreen = document.getElementById('waiting-screen');
          const matchDisplay = document.getElementById('match-display');

          if (this.matchStatus === 'idle' || this.matchStatus === 'not_started') {
            waitingScreen.classList.remove('hidden');
            matchDisplay.classList.remove('active');
          } else {
            waitingScreen.classList.add('hidden');
            matchDisplay.classList.add('active');
          }
        }
      }

      // Démarrer l'affichage
      document.addEventListener('DOMContentLoaded', () => {
        new ArenaDisplay();
      });
    </script>
  </body>
</html>
