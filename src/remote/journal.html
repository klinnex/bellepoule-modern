<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="journal.page_title">Journal – Piste</title>
    <script src="/common.js"></script>
    <script src="/i18n.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 1rem; font-size: 14px; }
      header { text-align: center; padding: 0.75rem 0 1rem; }
      header h1 { font-size: 1.1rem; color: #f8fafc; }
      #match-info { color: #94a3b8; font-size: 0.8rem; margin-top: 0.25rem; }
      #status { text-align: center; color: #94a3b8; padding: 2rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
      th { background: #1e293b; color: #94a3b8; padding: 0.45rem 0.6rem; text-align: left; font-weight: 600; position: sticky; top: 0; }
      td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #1e293b; }
      tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
      .badge { padding: 0.1rem 0.4rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
      .badge-score_change { background: #4c1d95; color: #c4b5fd; }
      .badge-touch { background: #1e3a5f; color: #93c5fd; }
      .badge-card { background: #450a0a; color: #fca5a5; }
      .badge-arena_exit { background: #451a03; color: #fcd34d; }
      .side-a { color: #60a5fa; font-weight: 600; }
      .side-b { color: #f87171; font-weight: 600; }
      .side-none { color: #6b7280; }
      .ts { font-family: monospace; color: #64748b; white-space: nowrap; }
      #last-update { position: fixed; bottom: 0.5rem; right: 0.75rem; font-size: 0.7rem; color: #475569; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <div id="match-info" data-i18n="journal.loading">Chargement…</div>
    </header>
    <div id="status"></div>
    <table id="log-table" style="display: none">
      <thead>
        <tr>
          <th data-i18n="journal.col_time">Heure</th>
          <th data-i18n="journal.col_type">Type</th>
          <th data-i18n="journal.col_fencer">Tireur</th>
          <th data-i18n="journal.col_desc">Description</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
    <div id="last-update"></div>
    <script>
      (function () {
        const tk = (key, params) => (window.T ? window.T(key, params) : key);
        const esc = window.escHtml;
        // Numéro de piste lu dans l'URL /areneN/journal (chiffres uniquement, #997)
        const m = window.location.pathname.match(/\/aren[ae](\d{1,3})\/journal/);
        const arenaNum = m ? m[1] : '1';
        const arenaId = 'arena' + arenaNum;
        let baseTs = null;
        const loc = () => document.documentElement.lang || undefined;

        // Retourne du HTML : tous les paramètres injectés sont échappés
        function describeEvent(e) {
          switch (e.eventType) {
            case 'touch':
              return tk('journal.zone', { zone: esc(e.zone || '?'), points: esc(e.points || 0) });
            case 'card':
              return (
                tk('journal.card', { type: esc(e.cardType || ''), reason: esc(e.cardReason || '') }) +
                (e.resultingExclusion ? tk('journal.exclusion') : '')
              );
            case 'arena_exit':
              return tk(e.exitType === 'arena_exit_voluntary' ? 'journal.exit_voluntary' : 'journal.exit', {
                points: esc(e.points || 0),
              });
            case 'score_change': {
              const val = s => (s && s.value != null ? s.value : '?');
              return (
                esc(val(e.previousScoreA) + '/' + val(e.previousScoreB) + ' → ' + val(e.newScoreA) + '/' + val(e.newScoreB)) +
                ' (' + esc(e.refereeName || e.changedBy || '?') + ')'
              );
            }
            default:
              return '';
          }
        }

        function formatTs(ts) {
          const d = new Date(ts);
          const abs = d.toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          if (!baseTs) return abs;
          const diff = d.getTime() - new Date(baseTs).getTime();
          if (diff < 0) return abs;
          const s = Math.floor(diff / 1000) % 60;
          const min = Math.floor(diff / 60000);
          return abs + ' (+' + (min > 0 ? min + 'm' : '') + String(s).padStart(2, '0') + 's)';
        }

        async function refresh() {
          try {
            const r = await fetch('/api/arena/' + arenaId + '/current-match/events');
            const data = await r.json();
            const info = document.getElementById('match-info');
            const status = document.getElementById('status');
            const table = document.getElementById('log-table');
            const body = document.getElementById('log-body');

            if (!data.matchId || data.events.length === 0) {
              info.textContent = tk('journal.no_match');
              status.textContent = data.matchId ? tk('journal.no_events') : '';
              table.style.display = 'none';
              baseTs = null;
              return;
            }

            baseTs = data.events[0].timestamp;
            info.textContent = tk('journal.match_running', { n: data.events.length });
            status.textContent = '';
            table.style.display = '';

            body.innerHTML = data.events
              .map(e => {
                const side = e.fencerSide
                  ? '<span class="side-' + esc(e.fencerSide.toLowerCase()) + '">' + esc(e.fencerSide) + ' — ' + esc(e.fencerLastName || '') + '</span>'
                  : '<span class="side-none">' + esc(tk('journal.match')) + '</span>';
                return (
                  '<tr><td class="ts">' + esc(formatTs(e.timestamp)) + '</td><td><span class="badge badge-' + esc(e.eventType) + '">' +
                  esc(e.eventType) + '</span></td><td>' + side + '</td><td>' + /* html */ describeEvent(e) + '</td></tr>'
                );
              })
              .reverse()
              .join('');

            document.getElementById('last-update').textContent = tk('journal.updated', {
              time: new Date().toLocaleTimeString(loc()),
            });
          } catch (err) {
            document.getElementById('status').textContent = tk('journal.conn_error');
          }
        }

        // Langue active (/api/config) appliquée avant le premier rendu
        const ready = window.initRemoteI18n ? window.initRemoteI18n() : Promise.resolve();
        ready.then(() => {
          document.title = tk('journal.page_title', { n: arenaNum });
          document.getElementById('title').textContent = tk('journal.title', { n: arenaNum });
          refresh();
          setInterval(refresh, 5000);
        });
      })();
    </script>
  </body>
</html>
