<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src * data:;">
  <title>BellePoule</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1729;
      color: #e8eaf0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      width: 520px;
      height: 460px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    body.fadeout { opacity: 0; }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 480px;
    }

    @keyframes icon-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      margin-bottom: 10px;
      animation: icon-breathe 2.5s ease-in-out infinite;
      image-rendering: -webkit-optimize-contrast;
    }

    .icon-placeholder {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #1e3a6e 0%, #3B5BDB 100%);
      animation: icon-breathe 2.5s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
      color: #e8eaf0;
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 10px;
      color: #3d4f72;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .version-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .version-text {
      font-size: 10px;
      color: #4a5a7a;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.05em;
    }

    .channel-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .channel-badge.main {
      background: rgba(59, 91, 219, 0.18);
      color: #6b84e8;
      border: 1px solid rgba(59, 91, 219, 0.3);
    }

    .channel-badge.dev {
      background: rgba(217, 119, 6, 0.18);
      color: #f59e0b;
      border: 1px solid rgba(217, 119, 6, 0.3);
    }

    .thanks {
      font-size: 10px;
      color: #6b7a9a;
      font-style: italic;
      letter-spacing: 0.04em;
      margin-top: -6px;
      margin-bottom: 14px;
    }

    .thanks strong {
      color: #c8a264;
      font-weight: 600;
      font-style: normal;
    }

    /* ---- Armes ---- */
    .weapons-wrap {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      align-items: center;
      justify-content: center;
    }

    .weapon-svg { overflow: visible; }

    @keyframes appear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes draw-epee  { from { stroke-dashoffset: 50; } to { stroke-dashoffset: 0; } }
    @keyframes draw-foil  { from { stroke-dashoffset: 72; } to { stroke-dashoffset: 0; } }
    @keyframes draw-sabre { from { stroke-dashoffset: 68; } to { stroke-dashoffset: 0; } }
    @keyframes draw-laser { from { stroke-dashoffset: 66; } to { stroke-dashoffset: 0; } }

    @keyframes laser-hue {
      0%, 100% { stroke: #ff2222; }
      50%      { stroke: #2244ff; }
    }
    @keyframes laser-glow-hue {
      0%, 100% { stroke: #ff6666; }
      50%      { stroke: #6688ff; }
    }

    .grip, .guard, .tip { opacity: 0; }
    .grip  { animation: appear 0.3s ease-out forwards; }
    .guard { animation: appear 0.3s ease-out forwards; }
    .tip   { animation: appear 0.2s ease-out forwards; }

    .weapon-svg:nth-child(1) .grip  { animation-delay: 0.1s; }
    .weapon-svg:nth-child(1) .guard { animation-delay: 0.25s; }
    .weapon-svg:nth-child(1) .tip   { animation-delay: 1.35s; }

    .weapon-svg:nth-child(2) .grip  { animation-delay: 0.6s; }
    .weapon-svg:nth-child(2) .guard { animation-delay: 0.75s; }
    .weapon-svg:nth-child(2) .tip   { animation-delay: 1.85s; }

    .weapon-svg:nth-child(3) .grip  { animation-delay: 1.1s; }
    .weapon-svg:nth-child(3) .guard { animation-delay: 1.25s; }
    .weapon-svg:nth-child(3) .tip   { animation-delay: 2.4s; }

    .weapon-svg:nth-child(4) .grip  { animation-delay: 1.6s; }
    .weapon-svg:nth-child(4) .guard { animation-delay: 1.75s; }

    .epee-blade {
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: draw-epee 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
    }

    .foil-blade {
      stroke-dasharray: 72;
      stroke-dashoffset: 72;
      animation: draw-foil 1s cubic-bezier(0.16,1,0.3,1) 0.8s forwards;
    }

    .sabre-blade {
      stroke-dasharray: 68;
      stroke-dashoffset: 68;
      animation: draw-sabre 1s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;
    }

    .laser-blade {
      stroke: #ff2222;
      stroke-dasharray: 66;
      stroke-dashoffset: 66;
      animation: draw-laser 1s cubic-bezier(0.16,1,0.3,1) 1.8s forwards,
                 laser-hue 3s ease-in-out 2.9s infinite;
    }

    .laser-glow {
      stroke: #ff6666;
      stroke-dasharray: 66;
      stroke-dashoffset: 66;
      opacity: 0.35;
      animation: draw-laser 1s cubic-bezier(0.16,1,0.3,1) 1.8s forwards,
                 laser-glow-hue 3s ease-in-out 2.9s infinite;
    }

    /* ---- Sélecteur de langue ---- */
    .lang-label {
      font-size: 10px;
      color: #4a5a7a;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .lang-select-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }

    .lang-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #4a5a7a;
      pointer-events: none;
      font-size: 12px;
    }

    .lang-select {
      width: 100%;
      padding: 9px 36px 9px 12px;
      border-radius: 8px;
      border: 1px solid #1e2d4a;
      background: #121d33;
      color: #e8eaf0;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .lang-select:hover {
      border-color: #2a3e66;
      background: #162035;
    }

    .lang-select:focus {
      border-color: #3B5BDB;
      background: rgba(59, 91, 219, 0.12);
    }

    .lang-select option {
      background: #121d33;
      color: #e8eaf0;
    }

    /* ---- Bouton confirmer ---- */
    .confirm-btn {
      width: 100%;
      padding: 9px 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #2F4AC4 0%, #3B5BDB 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s;
      box-shadow: 0 0 16px rgba(59, 91, 219, 0.35);
    }

    .confirm-btn:hover { opacity: 0.88; }
    .confirm-btn:active { opacity: 0.75; }
    .confirm-btn:disabled { opacity: 0.5; cursor: default; }

    .loading-phrase {
      margin-top: 12px;
      font-size: 11px;
      color: #4a5a7a;
      letter-spacing: 0.06em;
      min-height: 16px;
      text-align: center;
    }

    @keyframes ellipsis {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
      100% { content: ''; }
    }

    .loading-phrase.active::after {
      content: '';
      animation: ellipsis 1.2s steps(1) infinite;
    }

    /* ---- Phrases arbitre ---- */
    .phrases {
      display: flex;
      gap: 14px;
      align-items: center;
      height: 24px;
      margin-bottom: 14px;
    }

    @keyframes phrase-in {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .phrase {
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      animation: phrase-in 0.4s ease-out forwards;
    }

    .p1 { color: #5a6a8a; animation-delay: 0.3s; }
    .p2 { color: #7888aa; animation-delay: 1.4s; }
    .p3 {
      color: #4d77ff;
      font-weight: 700;
      font-size: 15px;
      text-shadow: 0 0 20px rgba(77, 119, 255, 0.5);
      animation-delay: 2.2s;
    }

    .sep { color: #2a3550; font-size: 14px; }

    /* ---- Drag region + close button ---- */
    .drag-region {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 36px;
      -webkit-app-region: drag;
    }

    .close-btn {
      position: fixed;
      top: 8px;
      right: 10px;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: #4a5a7a;
      font-size: 16px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      border-radius: 4px;
      padding: 0;
      -webkit-app-region: no-drag;
      transition: color 0.15s, background 0.15s;
    }

    .close-btn:hover {
      color: #e8eaf0;
      background: rgba(255,255,255,0.1);
    }

    .close-btn:active {
      background: rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>
  <div class="drag-region"></div>
  <button class="close-btn" onclick="closeSplash()" title="Close" aria-label="Close">&#x2715;</button>
  <div class="container">
    <img id="app-icon" class="icon" alt="" onerror="this.style.display='none'; document.getElementById('icon-fb').style.display='flex';">
    <div id="icon-fb" class="icon-placeholder" style="display:none;">⚔️</div>

    <div class="title">BellePoule Modern</div>
    <div class="subtitle" id="subtitle">Fencing Tournament Management</div>
    <div class="version-line">
      <span id="version-text" class="version-text">v1.0.0 · Build #0</span>
      <span id="channel-badge" class="channel-badge main">main</span>
    </div>
    <div class="thanks"><span id="thanks-label">Remerciements spéciaux à</span> <strong>Luc Van Gramberen</strong></div>

    <div class="weapons-wrap">
      <!-- Épée -->
      <svg width="110" height="50" viewBox="0 0 110 50" class="weapon-svg" xmlns="http://www.w3.org/2000/svg">
        <circle class="grip" cx="8" cy="25" r="6" fill="#a07840"/>
        <rect class="grip" x="14" y="21" width="28" height="8" rx="4" fill="#c8a264"/>
        <line class="grip" x1="20" y1="21.5" x2="20" y2="29.5" stroke="#a07840" stroke-width="1.5"/>
        <line class="grip" x1="27" y1="21.5" x2="27" y2="29.5" stroke="#a07840" stroke-width="1.5"/>
        <line class="grip" x1="34" y1="21.5" x2="34" y2="29.5" stroke="#a07840" stroke-width="1.5"/>
        <circle class="guard" cx="47" cy="25" r="11" fill="rgba(59,91,219,0.15)" stroke="#4d77ff" stroke-width="1.5"/>
        <circle class="guard" cx="47" cy="25" r="3" fill="#4d77ff"/>
        <line class="epee-blade" x1="58" y1="25" x2="104" y2="25" stroke="#a8c1ff" stroke-width="2" stroke-linecap="round"/>
        <polygon class="tip" points="104,22.5 110,25 104,27.5" fill="#a8c1ff"/>
      </svg>

      <!-- Fleuret -->
      <svg width="110" height="50" viewBox="0 0 110 50" class="weapon-svg" xmlns="http://www.w3.org/2000/svg">
        <circle class="grip" cx="7" cy="25" r="4.5" fill="#7a6030"/>
        <rect class="grip" x="11" y="22" width="22" height="6" rx="3" fill="#b89050"/>
        <line class="grip" x1="16" y1="22.5" x2="16" y2="28.5" stroke="#8a7040" stroke-width="1"/>
        <line class="grip" x1="22" y1="22.5" x2="22" y2="28.5" stroke="#8a7040" stroke-width="1"/>
        <rect class="guard" x="32" y="17" width="5" height="16" rx="2" fill="#555" stroke="#888" stroke-width="1"/>
        <line class="foil-blade" x1="37" y1="25" x2="106" y2="25" stroke="#c8d4ff" stroke-width="1" stroke-linecap="round"/>
        <circle class="tip" cx="108" cy="25" r="2.5" fill="#c8d4ff"/>
      </svg>

      <!-- Sabre -->
      <svg width="110" height="50" viewBox="0 0 110 50" class="weapon-svg" xmlns="http://www.w3.org/2000/svg">
        <circle class="grip" cx="8" cy="25" r="5" fill="#8a7030"/>
        <rect class="grip" x="13" y="22" width="23" height="6" rx="3" fill="#b89050"/>
        <line class="grip" x1="18" y1="22.5" x2="18" y2="28.5" stroke="#8a7040" stroke-width="1.2"/>
        <line class="grip" x1="24" y1="22.5" x2="24" y2="28.5" stroke="#8a7040" stroke-width="1.2"/>
        <line class="grip" x1="30" y1="22.5" x2="30" y2="28.5" stroke="#8a7040" stroke-width="1.2"/>
        <path class="guard" d="M 37,13 C 52,13 52,37 37,37 Z" fill="rgba(150,120,50,0.3)" stroke="#a08040" stroke-width="1.5"/>
        <line class="guard" x1="37" y1="13" x2="37" y2="37" stroke="#a08040" stroke-width="1.5"/>
        <path class="sabre-blade" d="M 43,25 Q 75,23 106,18" fill="none" stroke="#d0c090" stroke-width="1.5" stroke-linecap="round"/>
        <polygon class="tip" points="103,16.5 109,18 104,20.5" fill="#d0c090"/>
      </svg>

      <!-- Sabre Laser -->
      <svg width="110" height="50" viewBox="0 0 110 50" class="weapon-svg" xmlns="http://www.w3.org/2000/svg">
        <circle class="grip" cx="8" cy="25" r="5" fill="#3a3a4a"/>
        <rect class="grip" x="13" y="22" width="23" height="6" rx="3" fill="#4a4a5a"/>
        <line class="grip" x1="18" y1="22.5" x2="18" y2="28.5" stroke="#2a2a3a" stroke-width="1.2"/>
        <line class="grip" x1="24" y1="22.5" x2="24" y2="28.5" stroke="#2a2a3a" stroke-width="1.2"/>
        <line class="grip" x1="30" y1="22.5" x2="30" y2="28.5" stroke="#2a2a3a" stroke-width="1.2"/>
        <path class="guard" d="M 37,13 C 52,13 52,37 37,37 Z" fill="rgba(60,60,80,0.4)" stroke="#666688" stroke-width="1.5"/>
        <line class="guard" x1="37" y1="13" x2="37" y2="37" stroke="#666688" stroke-width="1.5"/>
        <line class="laser-glow" x1="43" y1="25" x2="107" y2="25" stroke-width="6" stroke-linecap="round"/>
        <line class="laser-blade" x1="43" y1="25" x2="107" y2="25" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="phrases">
      <span class="phrase p1" id="phrase1">En garde…</span>
      <span class="sep">·</span>
      <span class="phrase p2" id="phrase2">Prêts…</span>
      <span class="sep">·</span>
      <span class="phrase p3" id="phrase3">Allez !</span>
    </div>

    <div class="lang-label" id="lang-label">Language / Langue</div>

    <div class="lang-select-wrap">
      <select class="lang-select" id="lang-select" onchange="selectLang(this.value)">
        <option value="fr">🇫🇷  Français</option>
        <option value="en">🇺🇸  English</option>
        <option value="de">🇩🇪  Deutsch</option>
        <option value="es">🇪🇸  Español</option>
        <option value="zh-HK">🇭🇰  繁體中文</option>
        <option value="br">🏴  Brezhoneg</option>
        <option value="ca">🟡  Català</option>
      </select>
    </div>

    <button class="confirm-btn" id="confirm-btn" onclick="enterApp()">
      Entrer · Enter
    </button>
    <div class="loading-phrase" id="loading-phrase"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);

    // Icon
    const iconEl = document.getElementById('app-icon');
    let iconPath = params.get('icon') || '';
    if (iconPath && !/^file:/.test(iconPath)) {
      const norm = iconPath.replace(/\\/g, '/');
      iconPath = 'file://' + (norm.startsWith('/') ? '' : '/') + norm;
    }
    if (iconEl && iconPath) iconEl.src = iconPath;

    // Version + build + channel
    const version = params.get('version') || '?';
    const build = params.get('build') || '0';
    const channel = params.get('channel') || 'main';
    const versionEl = document.getElementById('version-text');
    const badgeEl = document.getElementById('channel-badge');
    if (versionEl) versionEl.textContent = 'v' + version + '  ·  Build #' + build;
    if (badgeEl) {
      badgeEl.textContent = channel;
      badgeEl.className = 'channel-badge ' + channel;
    }

    // Language selection
    var selectedLang = 'fr';

    function selectLang(lang) {
      selectedLang = lang;
      var sel = document.getElementById('lang-select');
      if (sel) sel.value = lang;
      updateConfirmLabel(lang);
    }

    var PHRASE_LABELS = {
      fr: ['En garde…', 'Prêts…', 'Allez !'],
      en: ['On guard…', 'Ready…', 'Fence!'],
      de: ['Auf die Plätze…', 'Fertig…', 'Los!'],
      es: ['En guardia…', 'Listos…', '¡Ya!'],
      'zh-HK': ['準備…', '就緒…', '開始！'],
      br: ['War zouarn…', 'Prest…', 'Allez !'],
      ca: ['En guàrdia…', 'Llestos…', 'Toca!'],
    };

    var SUBTITLE_LABELS = {
      fr: 'Gestion de Tournois d\'Escrime',
      en: 'Fencing Tournament Management',
      de: 'Fechtturnier-Verwaltung',
      es: 'Gestión de Torneos de Esgrima',
      'zh-HK': '擊劍賽事管理',
      br: 'Merañ Tournioù Klezeouriezh',
      ca: 'Gestió de Torneigs d\'Esgrima',
    };

    var THANKS_LABELS = {
      fr: 'Remerciements spéciaux à',
      en: 'Special thanks to',
      de: 'Besonderer Dank an',
      es: 'Agradecimiento especial a',
      'zh-HK': '特別鳴謝',
      br: 'Trugarez ispisial da',
      ca: 'Agraïment especial a',
    };

    var CONFIRM_LABELS = {
      fr: 'Entrer dans BellePoule',
      en: 'Enter BellePoule',
      de: 'BellePoule öffnen',
      es: 'Entrar en BellePoule',
      'zh-HK': '進入 BellePoule',
      br: 'Mont e BellePoule',
      ca: 'Entrar a BellePoule',
    };

    var LOADING_LABELS = {
      fr: 'Chargement de BellePoule',
      en: 'Loading BellePoule',
      de: 'BellePoule wird geladen',
      es: 'Cargando BellePoule',
      'zh-HK': '正在載入 BellePoule',
      br: 'O kargañ BellePoule',
      ca: 'Carregant BellePoule',
    };

    function updateConfirmLabel(lang) {
      var btn = document.getElementById('confirm-btn');
      if (btn && !btn.disabled) btn.textContent = CONFIRM_LABELS[lang] || CONFIRM_LABELS['en'];
      var sub = document.getElementById('subtitle');
      if (sub) sub.textContent = SUBTITLE_LABELS[lang] || SUBTITLE_LABELS['en'];
      var thanks = document.getElementById('thanks-label');
      if (thanks) thanks.textContent = THANKS_LABELS[lang] || THANKS_LABELS['en'];
      var phrases = PHRASE_LABELS[lang] || PHRASE_LABELS['en'];
      var p1 = document.getElementById('phrase1');
      var p2 = document.getElementById('phrase2');
      var p3 = document.getElementById('phrase3');
      if (p1) p1.textContent = phrases[0];
      if (p2) p2.textContent = phrases[1];
      if (p3) p3.textContent = phrases[2];
    }

    function enterApp() {
      var btn = document.getElementById('confirm-btn');
      var phrase = document.getElementById('loading-phrase');
      if (btn) {
        btn.disabled = true;
        btn.textContent = CONFIRM_LABELS[selectedLang] || CONFIRM_LABELS['en'];
      }
      if (phrase) {
        phrase.textContent = LOADING_LABELS[selectedLang] || LOADING_LABELS['en'];
        phrase.classList.add('active');
      }
      if (window.splashAPI) {
        window.splashAPI.confirm(selectedLang);
      }
    }

    function closeSplash() {
      if (window.splashAPI) {
        window.splashAPI.close();
      }
    }

    // Receive saved language from main process
    if (window.splashAPI) {
      window.splashAPI.onInit(function(savedLang) {
        selectLang(savedLang || 'fr');
      });
    }

    // Fallback: pre-select from query param
    var initLang = params.get('lang') || 'fr';
    selectLang(initLang);
  </script>
</body>
</html>
